name: CI
on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  checks:
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/check.py
      - run: python -m unittest discover -s tests -v
      - name: Generated catalogue is current
        run: |
          python scripts/update_catalog.py
          git diff --exit-code -- catalog/skills.json
      - name: Shell and hook syntax
        run: |
          for f in plugins/guardrails/scripts/*.sh scripts/*.sh; do bash -n "$f"; done
          python -m json.tool plugins/guardrails/hooks/hooks.json > /dev/null
  installer:
    name: Installer portability (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p test_installer.py -v
  boundary:
    name: Host execution boundary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pull pinned fixture runtime
        run: docker pull python:3.12-slim@sha256:191083cdf6c7bda8c76158983163ead5d5cf7b77cf3033e805bb0f5296f51b4b
      - name: Check enforced denials with synthetic input
        env:
          RUN_CONTAINER_TESTS: '1'
        run: python3 -m unittest discover -s tests -p test_execution_boundary.py -v
  validate:
    name: Claude Code plugin validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: npm install -g @anthropic-ai/claude-code@2.1.285
      - run: |
          claude plugin validate . --strict
          for p in plugins/*/; do claude plugin validate "$p" --strict; done
  required:
    name: Required checks
    if: always()
    needs: [checks, installer, boundary, validate]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: All required jobs succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          assert all(job['result'] == 'success' for job in results.values()), 'required job failed, cancelled or skipped'
          PY
